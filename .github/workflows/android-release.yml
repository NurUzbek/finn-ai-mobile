# ═══════════════════════════════════════════════════════════════════
#  FINN AI — imzolangan Android App Bundle (.aab) → Play Store
#  Linux runner (macOS kerakmas). Keystore GitHub Secret'dan tiklanadi.
#  Ishga tushirish: Actions → "Android release (.aab)" → Run workflow
# ═══════════════════════════════════════════════════════════════════
name: Android release (.aab)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter paketlar
        run: flutter pub get

      - name: Keystore + key.properties tiklash (secret'dan)
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
          echo "keystore bayt: $(stat -c%s android/upload-keystore.jks)"

      - name: App Bundle build (imzolangan release)
        run: flutter build appbundle --release

      - name: APK ham (yon-yuklash/test uchun)
        run: flutter build apk --release

      - name: .aab artefakt
        uses: actions/upload-artifact@v4
        with:
          name: finn-android-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: .apk artefakt
        uses: actions/upload-artifact@v4
        with:
          name: finn-android-apk
          path: build/app/outputs/flutter-apk/*.apk
