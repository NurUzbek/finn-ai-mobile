# ═══════════════════════════════════════════════════════════════════
#  FINN AI — imzolangan iOS build + TestFlight (Apple akkaunt bilan)
#  App Store Connect API key orqali AVTOMATIK imzo (sertifikat/profil
#  o'zi yaratiladi) — Codemagic servisi kerak emas, GitHub Actions macOS.
#  Ishga tushirish: Actions → "iOS signed (TestFlight)" → Run workflow
# ═══════════════════════════════════════════════════════════════════
name: iOS signed (TestFlight)

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      BUNDLE_ID: uz.finn.app
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 26 tanlash (Apple App Store talabi — iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Android ham aynan shu versiyada yig'ilgan — ikkala platforma bir xil SDK.
          flutter-version: 3.44.9

      - name: Codemagic CLI tools (imzo avtomatizatsiyasi)
        run: pip3 install --break-system-packages codemagic-cli-tools

      - name: Flutter paketlar
        run: flutter pub get

      - name: Bundle ID ro'yxatdan o'tkazish (bo'lmasa)
        run: app-store-connect bundle-ids register "$BUNDLE_ID" --name "FINN AI" --platform IOS || true

      - name: Imzo fayllari (sertifikat + profil avtomatik)
        run: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Keychain + sertifikatlar
        run: |
          keychain initialize
          keychain add-certificates

      # Ekspertiza 2.2.7: Dart kodi obfuskatsiya qilinadi. Bu bayroqlar
      # ios/Flutter/Generated.xcconfig ga yoziladi va keyingi `xcodebuild
      # archive` qadamidagi Flutter build fazasi ham ularni qo'llaydi.
      - name: Flutter iOS compile (imzosiz — assetlar + loyiha tayyorlanadi)
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols

      - name: Xcode profillari
        run: xcode-project use-profiles

      - name: Profillarni IKALA joyga ko'chirish (Xcode 15.4 eski joyni o'qiydi)
        run: |
          A="$HOME/Library/MobileDevice/Provisioning Profiles"
          B="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$A" "$B"
          cp "$B"/*.mobileprovision "$A"/ 2>/dev/null || true
          cp "$A"/*.mobileprovision "$B"/ 2>/dev/null || true
          echo "Eski joy (Xcode 15.4 shu yerdan o'qiydi):"; ls "$A" 2>/dev/null || echo "  bo'sh"
          echo "Yangi joy:"; ls "$B" 2>/dev/null || echo "  bo'sh"

      - name: Archive (xcodebuild — xatolar ko'rinadi)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            DEVELOPMENT_TEAM=P3M4C953PC CODE_SIGN_STYLE=Manual \
            -allowProvisioningUpdates > /tmp/arch.log 2>&1 || {
              echo "══════ ARCHIVE XATO (oxirgi qatorlar) ══════";
              grep -iE "error:|provisioning|codesign|signing|entitlement|requires|no account|no such" /tmp/arch.log | tail -40;
              echo "══════ umumiy tail ══════"; tail -30 /tmp/arch.log; exit 1;
            }
          echo "✓ archive OK"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$HOME/export_options.plist"

      - name: TestFlight'ga yuklash (app record bo'lsa)
        run: |
          app-store-connect publish \
            --path "$(find build/ios/ipa -name '*.ipa' | head -1)" \
            --testflight || echo "TestFlight yuklanmadi — App Store Connect'da app record yaratilishi kerak (.ipa baribir tayyor)"

      - name: Imzolangan .ipa artefakt
        uses: actions/upload-artifact@v4
        with:
          name: finn-ios-signed-ipa
          path: build/ios/ipa/*.ipa
