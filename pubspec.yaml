name: finn_ai
description: FINN AI — soliq va hisobot muddatlarini nazorat qiluvchi aqlli yordamchi (iOS/Android).
publish_to: 'none'
version: 1.3.5+64

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Tarmoq + saqlash
  http: ^1.2.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2      # token xavfsiz saqlanadi (Keychain/Keystore)

  # RASP — root/jailbreak, hook, yaxlitlik, emulyator (ekspertiza 2.2.1/2/5/6, 2.3.1/2)
  freerasp: ^8.2.4
  shared_preferences: ^2.3.2

  # Qurilma identifikatori (TZ: yangi qurilma SMS ogohlantirishi uchun)
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Push bildirishnoma — Firebase (finn-ec317) yoqilgan
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4   # local notification aniq vaqtga rejalash uchun

  # Kamera/galereya/bildirishnoma/SMS ruxsatlarini so'rash (o'rnatishdan keyin)
  permission_handler: ^11.3.1

  # OneID tashqi brauzer oqimi uchun deep-link (finnai://oneid?token=)
  app_links: ^6.3.2

  # Biometrik qulf (ixtiyoriy qo'shimcha himoya)
  local_auth: ^2.3.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.19.0
  url_launcher: ^6.3.1   # tarifni kengaytirish → finn.uz/subscription
  webview_flutter: ^4.14.1
  sms_autofill: ^2.5.0
  crypto: ^3.0.7
  audioplayers: ^6.1.0   # menyu bosilganda "pop" ovozi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    # SSL pinning ildiz sertifikatlari (ekspertiza 2.2.3). Ichki papka ALOHIDA
    # yozilishi shart — `assets/` faqat to'g'ridan-to'g'ri fayllarni oladi.
    - assets/certs/
  # FINN dizayn tizimi shriftlari (offline, variable .ttf — barcha og'irliklar).
  # FinnText 'Inter'/'InterTight' oilalarini shu yerdan oladi. google_fonts o'rniga.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/icon_bg.png"
  adaptive_icon_foreground: "assets/icon_fg.png"
